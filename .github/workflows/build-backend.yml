name: Build backend

# CI only. Builds the image, generates and scans an SBOM, pushes only if the
# scan passes, then bumps the tag in the gitops repo. Argo CD deploys it.
#
#   test ──────────────────────────────────────┐
#                                              ├──▶ update-gitops
#   build-push: build → SBOM → scan → push ────┘
#
# test and build-push run in parallel. update-gitops waits for both,
# so an image is only deployed if its tests AND its scan passed.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to AWS (and keyless signing in Phase 2)
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q backend/tests

  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
      tag: ${{ steps.push.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 1. Build. The image exists only on this runner for now.
      - name: Build image
        id: build
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_BACKEND }}"
          docker build --build-arg APP_VERSION="$TAG" -t "$IMAGE:$TAG" ./backend
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 2. SBOM: list every package in the image (CycloneDX format).
      - name: Generate SBOM from the local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image }}:${{ steps.build.outputs.tag }}
          format: cyclonedx
          output: sbom.cdx.json

      # 3. Scan the SBOM. A fixable CRITICAL fails the job here, BEFORE the push.
      - name: Scan SBOM, fail on fixable criticals
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.cdx.json
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      # Readable report in the job summary (never fails the job).
      - name: Vulnerability report (HIGH and CRITICAL)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.cdx.json
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: "0"

      - name: Add report to job summary
        if: always()
        run: |
          {
            echo "### Trivy scan: backend"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "No report produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep the SBOM even when the scan fails, to see which package caused it.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: |
            sbom.cdx.json
            trivy-report.txt
          if-no-files-found: ignore
      

      # 4. Push. Only reached if the scan passed.
      - name: Push image
        id: push
        run: |
          IMAGE="${{ steps.build.outputs.image }}"
          TAG="${{ steps.build.outputs.tag }}"
          docker push "$IMAGE:$TAG"
          # The registry digest only exists after the push. Phase 2 signs this.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE:$TAG ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"
           # 5. Sign with the private KMS key (never leaves AWS KMS; nothing goes to a public log)
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign image (by digest, AWS KMS)
        env:
          REF: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
          KEY: awskms:///alias/two-tier-image-signing
        run: |
          cosign sign --yes --key "$KEY" \
            --use-signing-config=false --tlog-upload=false \
            --new-bundle-format=false "$REF"

      - name: Attest SBOM
        env:
          REF: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
          KEY: awskms:///alias/two-tier-image-signing
        run: |
          cosign attest --yes --key "$KEY" \
            --use-signing-config=false --tlog-upload=false \
            --new-bundle-format=false \
            --type cyclonedx --predicate sbom.cdx.json "$REF"

      # 7. Verify both before anything is deployed
      - name: Verify signature and attestation
        env:
          REF: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
          KEY: awskms:///alias/two-tier-image-signing
        run: |
          cosign verify --key "$KEY" --insecure-ignore-tlog=true "$REF" > /dev/null
          cosign verify-attestation --key "$KEY" --insecure-ignore-tlog=true \
            --type cyclonedx "$REF" > /dev/null
          echo "### Signed: backend (AWS KMS, private) — \`$REF\`" >> "$GITHUB_STEP_SUMMARY"

  update-gitops:
    needs: [test, build-push]
    runs-on: ubuntu-latest
    # Same group in both build workflows, so two bumps never push at once
    concurrency:
      group: gitops-update
      cancel-in-progress: false
    steps:
      - name: Check out gitops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ vars.GITOPS_REPO_NAME }}
          token: ${{ secrets.GITOPS_TOKEN }}   # fine-grained PAT: Contents read/write on the gitops repo
          ref: main

      # Still deploys by tag. Phase 2 switches this to the digest.
      - name: Bump image in Helm values
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          TAG: ${{ needs.build-push.outputs.tag }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          yq -i '.backend.image.repository = strenv(IMAGE) | .backend.image.tag = strenv(TAG) | .backend.image.digest = strenv(DIGEST)' charts/two-tier/values.yaml
          git diff

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/two-tier/values.yaml
          if git diff --cached --quiet; then
            echo "Tag already set, nothing to commit."
            exit 0
          fi
          git commit -m "backend: deploy ${{ needs.build-push.outputs.tag }}" \
                     -m "Digest: ${{ needs.build-push.outputs.digest }}" \
                     -m "From ${{ github.repository }}@${{ github.sha }}"
          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1

      - name: Summary
        run: |
          echo "### backend ${{ needs.build-push.outputs.tag }} committed to ${{ vars.GITOPS_REPO_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Argo CD will sync it within ~3 minutes." >> "$GITHUB_STEP_SUMMARY"