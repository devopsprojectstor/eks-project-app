name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "k8s/backend.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q backend/tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_BACKEND }}:$TAG"
          docker build --build-arg APP_VERSION="$TAG" -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER }}"
          sed "s|BACKEND_IMAGE|$IMAGE|" k8s/backend.yaml | kubectl apply -f -
          kubectl rollout status deployment/backend -n two-tier --timeout=180s
