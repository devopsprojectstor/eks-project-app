name: Deploy frontend

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_FRONTEND }}:$TAG"
          docker build -t "$IMAGE" ./frontend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Check backend is deployed
        run: |
          aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER }}"
          # nginx needs the backend Service to exist, or it fails to start
          kubectl get svc backend -n two-tier || {
            echo "::error::Backend service not found. Run the 'Deploy backend' workflow first."
            exit 1
          }

      - name: Deploy to EKS
        run: |
          sed "s|FRONTEND_IMAGE|$IMAGE|" k8s/frontend.yaml | kubectl apply -f -
          kubectl rollout status deployment/frontend -n two-tier --timeout=180s

      - name: Show app URL
        run: |
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc frontend -n two-tier -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$HOST" ] && break
            sleep 10
          done
          echo "App URL: http://$HOST"
          echo "### App URL: http://$HOST" >> "$GITHUB_STEP_SUMMARY"
